
services:
  mc-modpack-installer:
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile.modinstaller
    volumes:
      - ./modpack:/modpack
      - ./data:/data
      - ./scripts:/scripts
    environment:
      MODRINTH_URL: ${MODRINTH_URL:-https://cdn.modrinth.com/data/Jkb29YJU/versions/4SKGla61/COBBLEVERSE%201.7.42.mrpack}
      SERVER_WORLDNAME: ${SERVER_WORLDNAME:-MY_COBBLEVERSE_WORLD}
    entrypoint: ["/bin/sh", "/scripts/install-modpack.sh"]


  mc:
    # Pinned to Java 21: MC 1.21.1 + Fabric + this modpack's mixin versions
    # crash on newer JDKs ("Unsupported class file major version 69" from
    # the :latest tag's Java 25). See install-modpack.sh.
    image: itzg/minecraft-server:java21
    environment:
      EULA: "true"
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "0.18.4"
      FABRIC_LAUNCHER_VERSION: "1.0.3"
      MEMORY: "6G"
      SERVER_WORLDNAME: ${SERVER_WORLDNAME:-MY_COBBLEVERSE_WORLD}
      LEVEL: ${SERVER_WORLDNAME:-MY_COBBLEVERSE_WORLD}
      ENABLE_WHITELIST: "false"
      DEBUG: ${DEBUG:-False}
      SERVER_NAME: ${SERVER_NAME:-Cobbleverse}
      ICON: ${SERVER_ICON:-}
      ALLOW_FLIGHT: ${ALLOW_FLIGHT:-False}
      SPAWN_MONSTERS: ${SPAWN_MONSTERS:-False}


    volumes:
      - ./modpack:/modpack
      - ./data:/data
      - ./worlds:/data/worlds
      - ./scripts/wait-for-modpack.sh:/wait-for-modpack.sh
    entrypoint: ["/bin/sh", "/wait-for-modpack.sh"]
    command: []
    ports:
      - "25565:25565"
    depends_on:
      - mc-modpack-installer
    restart: unless-stopped
